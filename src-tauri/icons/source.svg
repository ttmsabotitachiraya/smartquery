<svg width="1024" height="1024" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E63946"/>
      <stop offset="100%" stop-color="#FFB703"/>
    </linearGradient>

    <filter id="boltShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Full-bleed background, no rounded corners -->
  <rect width="100" height="100" fill="#2B2B2B"/>

  <!-- Ring / donut -->
  <path d="M50 15
           A35 35 0 0 1 85 50
           A35 35 0 0 1 50 85
           A35 35 0 0 1 15 50
           A35 35 0 0 1 50 15
           ZM50 25
           A25 25 0 0 0 25 50
           A25 25 0 0 0 50 75
           A25 25 0 0 0 75 50
           A25 25 0 0 0 50 25 Z"
        fill="#F8EDEB" opacity="0.4"/>

  <!-- Lightning bolt -->
  <path d="M52 10 L35 50 H48 L45 90 L65 50 H52 Z"
        fill="url(#mainGradient)"
        filter="url(#boltShadow)"/>
</svg>
