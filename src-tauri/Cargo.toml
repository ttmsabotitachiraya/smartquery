[package]
name = "smartquery"
version = "3.0.0"
description = "SmartQuery for HOSxP"
authors = ["กลุ่มงานแพทย์แผนไทย โรงพยาบาลสระโบสถ์"]
edition = "2021"

[lib]
name = "smartquery_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["mysql", "runtime-tokio-native-tls", "chrono", "rust_decimal"] }
rust_decimal = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
dirs = "5"
